server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smartstock
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}

logging:
  level:
    org.springframework: ${LOGGING_LEVEL_SPRING:INFO}
